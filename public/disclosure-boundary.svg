<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" role="img" aria-labelledby="title desc"><title id="title">Invoice disclosure boundary</title><desc id="desc">Private invoice fields remain to the left; a commitment boundary separates them from the limited public fields on the right.</desc><rect x="1" y="1" width="798" height="188" rx="5" fill="#FCFCFD" stroke="#E6E2E5"/><path d="M28 34h280M28 50h180M28 66h238M28 82h212" stroke="#C9C1C6" stroke-width="5" stroke-linecap="round"/><path d="M339 22v146" stroke="#943D64" stroke-width="2" stroke-dasharray="3 7"/><circle cx="339" cy="95" r="20" fill="#FCFCFD" stroke="#943D64" stroke-width="2"/><path d="M330 95h18M339 86v18" stroke="#943D64" stroke-width="2"/><path d="M375 48h170M375 67h210M375 86h130" stroke="#8FAEAA" stroke-width="5" stroke-linecap="round"/><rect x="594" y="42" width="178" height="72" rx="4" fill="#F3F7F6" stroke="#B7CCCA"/><path d="M610 61h143M610 76h94M610 91h117" stroke="#648681" stroke-width="4" stroke-linecap="round"/><text x="28" y="151" fill="#6F6870" font-family="Arial,sans-serif" font-size="12">PRIVATE · issuer + invoice identity</text><text x="375" y="151" fill="#6F6870" font-family="Arial,sans-serif" font-size="12">PUBLIC · commitment + selected terms</text></svg>
